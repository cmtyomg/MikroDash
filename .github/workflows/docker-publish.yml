name: Build & Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Must be lowercase — Docker registry names are case-sensitive
  IMAGE_NAME: cmtyomg/mikrodash

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # QEMU lets the runner execute non-amd64 instructions via emulation.
      #
      # linux/arm/v7 IS BACK as of v0.8.0. It was dropped at the Node 24 move
      # because node:24-alpine published no 32-bit ARM variant (amd64, arm64/v8
      # and s390x only), which stranded ARMv7 users on 0.5.54 — and restoring it
      # was one of the stated motives for the Go rewrite. The runtime is now
      # alpine with a CGO_ENABLED=0 static binary, and Go cross-compiles, so the
      # constraint that removed it no longer exists.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64,linux/arm/v7

      # Buildx is the Docker CLI plugin that drives multi-platform builds.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Main publishes latest and a commit tag so this fork can be installed
      # directly from GHCR. Version tags additionally publish semver aliases.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      # One image supports ordinary servers, ARM64 and ARMv7 devices.
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Build cache stays in Actions; only application images are in GHCR.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Create a GitHub Release on version tags, using the matching CHANGELOG section
  # as the release body. Only runs after the Docker image is successfully published.
  create-release:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract changelog for this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract description from the CHANGELOG header line, e.g. "CAPsMAN support, ..."
          # Separator-tolerant on purpose: entries up to 0.7.33 use an em dash, 0.7.34 onward use a
          # plain hyphen because em dashes are not wanted in anything user-facing. A hard-coded " — "
          # here would silently yield an empty description for every future release, and the release
          # would publish with no title rather than fail.
          DESCRIPTION=$(grep "^## \[${VERSION}\]" CHANGELOG.md | head -1 \
            | sed -E "s/^## \[${VERSION}\][[:space:]]*[—–:-][[:space:]]*//")
          # Build release notes: description as a heading, then the section body
          {
            [ -n "$DESCRIPTION" ] && printf '## %s\n\n' "$DESCRIPTION"
            awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md
          } > release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release_notes.md

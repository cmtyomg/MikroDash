name: mikrodash

services:
  mikrodash:
    image: ghcr.io/cmtyomg/mikrodash:latest
    container_name: MikroDash
    ports:
      - "3081:3081"
    volumes:
      - data:/data
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
      - MIKRODASH_ORIGINS=${MIKRODASH_ORIGINS:-}
      - MIKRODASH_TRUSTED_PROXIES=${MIKRODASH_TRUSTED_PROXIES:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3081/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
